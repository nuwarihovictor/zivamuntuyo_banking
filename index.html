<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ZIVAMUNTUYO FINANCIAL SERVICES LTD - Banking System</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #0a1f18;
      --card-bg: #112d23;
      --primary: #15803d;
      --gold: #d97706;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #1e4637;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); min-height: 100vh; padding: 16px; }
    #app { width: 100%; max-width: 1200px; margin: 0 auto; }
    
    .topbar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    .brand-sm { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #fff; }
    .logo-sm { background: linear-gradient(135deg, var(--gold), #b45309); color: #fff; width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .user-info { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
    
    .layout { display: flex; gap: 20px; flex-direction: column; }
    @media(min-width: 768px) { .layout { flex-direction: row; } }
    .sidebar { width: 100%; max-width: 240px; display: flex; flex-direction: column; gap: 8px; }
    .nav-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 12px; text-align: left; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; transition: 0.2s; }
    .nav-btn:hover, .nav-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    
    .content { flex: 1; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; min-height: 400px; }
    .panel { margin-bottom: 24px; }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="workspace" style="display: block;">
      <header class="topbar">
        <div class="brand-sm">
          <span class="logo-sm">Z</span>
          <strong>ZIVAMUNTUYO FINANCIAL SERVICES LTD</strong>
        </div>
        <div class="user-info">
          <span id="user-display">Nuwariho Victor (Admin Bypass)</span>
          <button id="btn-logout" class="secondary" onclick="location.reload()">Refresh</button>
        </div>
      </header>

      <div class="layout">
        <nav class="sidebar">
          <button class="nav-btn active" data-page="Dashboard">📊 Dashboard</button>
          <button class="nav-btn" data-page="Customers">👥 Customers</button>
          <button class="nav-btn" data-page="Accounts">🏦 Accounts</button>
          <button class="nav-btn" data-page="Transactions">💰 Transactions</button>
          <button class="nav-btn" data-page="Approvals">✅ Approvals</button>
          <button class="nav-btn" data-page="Reports">📈 Reports</button>
          <button class="nav-btn" data-page="Settings">⚙️ Settings</button>
        </nav>

        <main id="main-content" class="content">
          <p style="color:#9ca3af;">Initializing workspace...</p>
        </main>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
