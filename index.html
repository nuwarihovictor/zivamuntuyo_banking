<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ZIVAMUNTUYO FINANCIAL SERVICES LTD - Banking System</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">
    <!-- LOGIN INTERFACE WITH ORIGINAL BRANDING & STYLES -->
    <div id="login-screen">
      <div class="card login-card">
        <div class="brand">
          <div class="logo">Z</div>
          <div>
            <h1>ZIVAMUNTUYO</h1>
            <p>FINANCIAL SERVICES LTD</p>
          </div>
        </div>

        <div class="tag">SECURE ACCESS</div>
        <h2>Welcome back</h2>
        <p class="muted">Sign in with your authorized staff account.</p>

        <form id="login-form" autocomplete="off" action="javascript:void(0);" method="post">
          <!-- Hidden inputs to stop browser autofill hijacking -->
          <input type="text" name="fake_email" style="display:none !important;" tabindex="-1" />
          <input type="password" name="fake_password" style="display:none !important;" tabindex="-1" />

          <label for="work-email">Work email</label>
          <input 
            type="email" 
            id="work-email" 
            name="staff_email" 
            value="info.nuwarihovictor@gmail.com" 
            autocomplete="one-time-code" 
            required 
          />

          <label for="work-password">Password</label>
          <input 
            type="password" 
            id="work-password" 
            name="staff_password" 
            placeholder="••••••••" 
            autocomplete="one-time-code" 
            required 
          />

          <button type="submit" class="primary">Sign in securely &rarr;</button>
          <p id="login-msg" class="error"></p>
        </form>

        <p class="muted small">Access depends on assigned role and branch permissions.</p>
      </div>
    </div>

    <!-- MAIN WORKSPACE -->
    <div id="workspace" style="display: none;">
      <header class="topbar">
        <div class="brand-sm">
          <span class="logo-sm">Z</span>
          <strong>ZIVAMUNTUYO FINANCIAL SERVICES LTD</strong>
        </div>
        <div class="user-info">
          <span id="user-display">Staff User</span>
          <button id="btn-logout" class="secondary">Logout</button>
        </div>
      </header>

      <div class="layout">
        <nav class="sidebar">
          <button class="nav-btn active" data-page="Dashboard">📊 Dashboard</button>
          <button class="nav-btn" data-page="Customers">👥 Customers</button>
          <button class="nav-btn" data-page="Accounts">🏦 Accounts</button>
          <button class="nav-btn" data-page="Transactions">💰 Transactions</button>
          <button class="nav-btn" data-page="Approvals">✅ Approvals</button>
          <button class="nav-btn" data-page="Reports">📈 Reports</button>
          <button class="nav-btn" data-page="Settings">⚙️ Settings</button>
        </nav>

        <main id="main-content" class="content">
          <!-- Dynamic content loaded by app.js -->
        </main>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
