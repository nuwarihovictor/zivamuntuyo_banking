name: Disposable PostgreSQL draft-migration tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [fix/account-eligibility-guards-2026-10-19]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-draft-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d banking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: banking_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client and static test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --disable-pip-version-check pglast
      - name: Run consolidated release preflight against disposable PostgreSQL
        env:
          ZIVAMUNTUYO_DISPOSABLE_DB: "1"
        run: python scripts/release_preflight.py
