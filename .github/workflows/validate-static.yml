name: Validate static banking app
on:
  pull_request:
  push:
    branches:
      - main
      - release/deployment-readiness-2026
      - integration/full-system-audit-2026-10
      - integration/close-release-gaps-2026-10
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-release-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application JavaScript syntax
        run: node --check app.js
      - name: Check release validation script syntax
        run: node --check scripts/validate-release.mjs
      - name: Run dependency-free release guard
        run: node scripts/validate-release.mjs
