name: Validate static banking app
on:
  pull_request:
  push:
    branches:
      - main
      - release/deployment-readiness-2026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application JavaScript syntax
        run: node --check app.js
      - name: Verify core static files exist
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
